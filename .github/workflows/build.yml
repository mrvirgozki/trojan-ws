name: Build & Push to Docker Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Optional: dagdag permissions para sigurado
    permissions:
      contents: read

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Siguraduhin TAMA ang pangalan ng secrets dito
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6 # pwede mo i-update sa latest v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mrvirgozki/trojan-ws:latest
          # Optional: dagdag cache para mas mabilis
          cache-from: type=registry,ref=mrvirgozki/trojan-ws:buildcache
          cache-to: type=registry,ref=mrvirgozki/trojan-ws:buildcache,mode=max
